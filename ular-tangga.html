<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ular Tangga Edukatif 🐍🪜</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="ular-tangga.css">
</head>
<body>
    <div class="game-container">
        <!-- Fullscreen Button -->
        <button id="btn-fullscreen-ular" class="btn-fs" title="Perlebar Layar" style="position: absolute; top: 20px; right: 20px; z-index: 1000; background: #fff; border: none; border-radius: 50%; width: 50px; height: 50px; font-size: 1.5rem; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2);"><i class="fa-solid fa-expand"></i></button>
        <!-- Sidebar Panel -->
        <div class="sidebar">
            <a href="index.html" title="Kembali ke Menu Utama" style="display: inline-block; background: #f0f2f5; color: #333; border: 2px solid #ddd; text-decoration: none; padding: 10px 15px; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; margin-bottom: 5px; width: fit-content; transition: 0.2s;"><i class="fa-solid fa-arrow-left"></i> Menu Utama</a>
            <div class="logo">
                <h1>🐍 Ular Tangga 🪜</h1>
                <p>Belajar PAI Seru!</p>
            </div>

            <div class="players-info">
                <div class="player-card active" id="player1-card">
                    <div class="avatar">👦</div>
                    <h3>Pemain 1</h3>
                    <p class="position-text">Posisi: <span id="pos-p1">1</span></p>
                </div>
                <div class="player-card" id="player2-card">
                    <div class="avatar">👧</div>
                    <h3>Pemain 2</h3>
                    <p class="position-text">Posisi: <span id="pos-p2">1</span></p>
                </div>
            </div>

            <div class="dice-section">
                <div class="dice-container" id="dice-container" onclick="rollDice()">
                    <div class="dice" id="dice">🎲</div>
                </div>
                <p id="dice-status">Giliran Pemain 1</p>
            </div>
            
            <div id="game-messages">Mulai Bermain!</div>
        </div>

        <!-- Board Area -->
        <div class="board-area">
            <div class="board" id="board">
                <!-- Grid items generated by JS -->
                <svg id="snakes-ladders-svg" class="overlay-svg"></svg>
            </div>
            
            <!-- Player Tokens -->
            <div id="token-p1" class="token token-p1">👦</div>
            <div id="token-p2" class="token token-p2">👧</div>
        </div>
    </div>

    <!-- Math Question Modal -->
    <div class="modal-overlay" id="math-modal">
        <div class="modal-content">
            <h2 id="question-title">Kuis PAI!</h2>
            <p id="question-text">Loading...</p>
            <div class="options-grid" id="options-container">
                <!-- Buttons generated by JS -->
            </div>
            <div id="modal-feedback" class="feedback-text"></div>
        </div>
    </div>

    <!-- End Game Modal -->
    <div class="modal-overlay" id="win-modal">
        <div class="modal-content win-content">
            <h2>🎉 SELAMAT! 🎉</h2>
            <div class="winner-avatar" id="winner-avatar">👦</div>
            <p id="winner-text">Pemain 1 Menang!</p>
            <button class="play-again-btn" onclick="location.reload()">Main Lagi</button>
        </div>
    </div>

    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="ular-tangga.js"></script>
</body>
</html>
