<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino Tug of War</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="dino-tug-of-war.css">
</head>
<body>
    <button id="btn-fullscreen" title="Perbesar Layar" style="position: absolute; top: 20px; right: 20px; z-index: 1000; background: #fff; border: none; border-radius: 50%; width: 50px; height: 50px; font-size: 1.5rem; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2);"><i class="fa-solid fa-expand"></i></button>
    <div class="game-screen fade-in">
        <!-- Top - Questions -->
        <div class="game-top">
            <div class="team-panel team-a">
                <div class="team-header">
                    🏁 TIM A (HIJAU)
                </div>
                <div class="question-text" id="question-a">Pertanyaan Tim A akan muncul di sini...</div>
            </div>
            <div class="team-panel team-b">
                <div class="team-header">
                    🏁 TIM B (MERAH)
                </div>
                <div class="question-text" id="question-b">Pertanyaan Tim B akan muncul di sini...</div>
            </div>
        </div>

        <!-- Middle - Tug of War Visual -->
        <div class="game-middle">
            <a href="index.html" class="menu-btn">⬅ Menu</a>
            <div class="score-indicator">
                <span class="score-a-text">TIM A</span>
                <span class="score-center" id="score-text">| 50% - 50% |</span>
                <span class="score-b-text">TIM B</span>
            </div>

            <div class="clouds"></div>
            <div class="rope-container">
                <div class="rope">
                    <div class="mark-a"></div>
                    <div class="mark-b"></div>
                    <div class="rope-center-mark" id="rope-center"></div>
                </div>
            </div>
            <div class="dino-character dino-a" id="dino-a">🦖</div>
            <div class="dino-character dino-b" id="dino-b">🦕</div>
        </div>

        <!-- Bottom - Answers -->
        <div class="game-bottom">
            <div class="answers-panel team-a-answers" id="answers-a">
                <!-- Answer buttons generated by JS -->
            </div>
            <div class="answers-panel team-b-answers" id="answers-b">
                <!-- Answer buttons generated by JS -->
            </div>
        </div>

        <!-- Winner Overlay -->
        <div class="winner-overlay" id="winner-overlay" style="display: none;">
            <h2 id="winner-text">🎉 TIM MENANG! 🎉</h2>
            <button class="play-again-btn" onclick="resetGame()">Main Lagi</button>
        </div>
    </div>

    <script src="dino-tug-of-war.js"></script>
</body>
</html>
